name: Editor-in-Chief AI rewrite safety
on:
  push:
    branches:
      - work/editor-chief-2-ai-rewrite
  pull_request:
    paths:
      - 'services/ebook_ai_rewrite.py'
      - 'tests/test_ebook_ai_rewrite.py'
      - '.github/workflows/editor-chief-ai-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewrite-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACTORY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.1
      - run: python -m py_compile services/ebook_ai_rewrite.py tests/test_ebook_ai_rewrite.py
      - run: python -m pytest -q tests/test_ebook_ai_rewrite.py
