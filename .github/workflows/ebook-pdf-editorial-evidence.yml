name: Ebook PDF editorial evidence
on:
  push:
    branches: [work/editor-chief-pdf-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FACTORY_TEST_MODE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest==8.4.1
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - name: Prove the three regressions fail on the unchanged baseline
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, xml.etree.ElementTree as ET
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'editorial-baseline'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(base), '711b696d4a7a1c8e5dc01b0cb23f05469f5f1990'], check=True)
          test = 'tests/test_interior_visual_editorial_standard.py'
          shutil.copyfile(test, base / test)
          names = ['test_pdf_reader_unavailable_never_passes_visual_inspection', 'test_unused_pdf_image_resource_does_not_satisfy_planned_visual', 'test_multiple_cover_images_cannot_substitute_for_interior_visual']
          xml = pathlib.Path(os.environ['RUNNER_TEMP']) / 'editorial-baseline.xml'
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '--junitxml', str(xml)] + [test + '::' + n for n in names], cwd=base)
          suites = ET.parse(xml).getroot().findall('.//testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          assert result.returncode == 1 and totals == dict(tests=3, failures=3, errors=0, skipped=0), totals
          print('Verified: all three new regressions fail on the original source.')
          PY
      - name: Corrected visual editorial review and ebook design checks
        run: python -m pytest -q tests/test_interior_visual_editorial_standard.py tests/test_ebook_designrr_quality.py tests/test_ebook_design_export.py
      - name: Stability and protected product checks after correction
        run: python scripts/fast_gate.py
