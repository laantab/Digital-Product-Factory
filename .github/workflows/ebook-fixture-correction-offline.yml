name: Ebook Safe Mode correction and protected regressions

on:
  pull_request:
    paths:
      - 'services/ebook_project_workspace.py'
      - 'services/ebook_build_orchestrator.py'
      - 'services/ebook_saved_downloads.py'
      - 'command_center/function_lock_registry.json'
      - 'tests/test_ebook_fixture_correction_offline.py'
      - 'tests/test_ebook_accepted_chapter_revalidation.py'
      - 'tests/test_ebook_manuscript_correction_recovery.py'
      - 'tests/test_ebook_creation_modes.py'
      - 'tests/test_ebook_saved_downloads_asset_fallback.py'
      - 'tests/test_storage_r2_cutover.py'
      - '.github/workflows/ebook-fixture-correction-offline.yml'

permissions:
  contents: read

jobs:
  fixture-correction-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 playwright==1.56.0
      - name: Install Chromium for protected browser tests
        run: python -m playwright install --with-deps chromium
      - name: Compile source and regression
        run: python -m py_compile services/ebook_project_workspace.py services/ebook_build_orchestrator.py tests/test_ebook_fixture_correction_offline.py tests/test_ebook_accepted_chapter_revalidation.py tests/test_ebook_manuscript_correction_recovery.py
      - name: Prove rejected chapter double-call on immutable pre-fix baseline
        env:
          BASE_SHA: 3bf10676a739d9c8fc7533a2a8991166b3463763
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qa-reject-double-call-baseline'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(base), os.environ['BASE_SHA']], check=True)
          path = 'tests/test_ebook_manuscript_correction_recovery.py'
          shutil.copyfile(path, base / path)
          test = path + '::test_orchestrator_auto_corrects_and_advances_past_manuscript'
          proc = subprocess.run(
              [sys.executable, '-m', 'pytest', '-q', test],
              cwd=base, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          assert proc.returncode != 0 and (
              'one /advance generated and repaired a rejected chapter together: [10, 10]' in proc.stdout
          ), proc.stdout
          print('Confirmed: pre-fix build generated and repaired chapter 10 in one request.')
          PY
      - name: Prove fixture repair test fails against unmodified main
        env:
          # Immutable pre-fix PR #94 baseline; never use a moving main.
          BASE_SHA: 68ba3f92d5519501d61534538727d35166ea53b4
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fixture-correction-baseline'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(base), os.environ['BASE_SHA']], check=True)
          path = 'tests/test_ebook_fixture_correction_offline.py'
          shutil.copyfile(path, base / path)
          proc = subprocess.run(
              [sys.executable, '-m', 'pytest', '-q', path],
              cwd=base, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          assert proc.returncode != 0 and 'test_fixture_mode_correction_never_calls_live_chapter_provider' in proc.stdout, proc.stdout
          assert 'AssertionError' in proc.stdout, proc.stdout
          print('Confirmed: baseline fixture-mode correction does not finish offline.')
          PY
      - name: Verify offline fixture correction and manuscript recovery
        run: python -m pytest -q tests/test_ebook_fixture_correction_offline.py tests/test_ebook_manuscript_correction_recovery.py tests/test_ebook_fixture_dual_gate.py tests/test_ebook_accepted_chapter_revalidation.py
      - name: Verify saved ebook PDF and ZIP after disk-only loss
        run: python -m pytest -q tests/test_ebook_saved_downloads_asset_fallback.py
      - name: Verify general protected product paths
        run: python scripts/fast_gate.py
      - name: Verify protected ebook and PDF ZIP customer paths
        timeout-minutes: 35
        env:
          EBOOK_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/ebook-acceptance
        run: |
          python - <<'PY'
          import json, subprocess, sys
          with open('command_center/function_lock_registry.json', encoding='utf-8') as f:
              registry = json.load(f)['functions']
          names = ('ebook', 'pdf_zip_export', 'ebook_one_button_completion')
          files = list(dict.fromkeys(path for name in names for path in registry[name]['protected_test_files']))
          assert len(files) >= 20, 'Protected regression coverage unexpectedly shrank'
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', *files]))
          PY

      - name: Retain verified offline ebook PDF and ZIP downloads
        uses: actions/upload-artifact@v4
        with:
          name: ebook-offline-pdf-zip-${{ github.run_id }}
          path: ${{ runner.temp }}/ebook-acceptance/
          if-no-files-found: error
          retention-days: 7
