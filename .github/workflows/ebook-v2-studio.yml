name: Book Studio Windows and Linux customer paths

on:
  pull_request:
    paths:
      - 'services/ebook_v2/**'
      - 'templates/ebook_v2.html'
      - 'tests/test_ebook_v2*'
      - 'requirements-ebook-v2.txt'
      - '.github/workflows/ebook-v2-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-studio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      DATABASE_URL: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
      UNSPLASH_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only Studio and test dependencies
        run: python -m pip install -r requirements-ebook-v2.txt pytest==8.4.1 playwright==1.52.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check inline application JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('templates/ebook_v2.html').read_text(encoding='utf-8'); Path('studio-ui.js').write_text(s.split('<script>')[1].split('</script>')[0],encoding='utf-8')"
          node --check studio-ui.js
      - name: Verify isolated customer paths and protection contracts
        run: python -m pytest -q tests/test_ebook_v2_recovery.py tests/test_ebook_v2_books.py tests/test_ebook_v2_customer_path.py tests/test_ebook_v2_topics.py tests/test_function_lock_registry_integrity.py tests/test_function_lock_enforcement.py --junitxml=studio-junit.xml
      - name: Require all 97 Studio and protection cases with no failures errors or skips
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('studio-junit.xml').getroot(); s=list(r.iter('testsuite')); assert sum(int(x.get('tests','0')) for x in s)==97; assert not any(int(x.get(k,'0')) for x in s for k in ('failures','errors','skipped'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-junit-${{ matrix.os }}-${{ matrix.python }}
          path: studio-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  factory-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      DATABASE_URL: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
      UNSPLASH_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full Factory test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify all legacy version contracts
        run: python -m pytest -q tests/test_version_management.py --junitxml=factory-version-junit.xml
      - name: Require all 31 version cases with no skips
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('factory-version-junit.xml').getroot(); s=list(r.iter('testsuite')); assert sum(int(x.get('tests','0')) for x in s)==31; assert not any(int(x.get(k,'0')) for x in s for k in ('failures','errors','skipped'))"
      - name: Verify the complete protected fast gate
        run: python scripts/fast_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-version-junit
          path: factory-version-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  fresh-local-model:
    needs: isolated-studio
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      DATABASE_URL: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
      UNSPLASH_API_KEY: ''
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
      FACTORY_V2_OLLAMA_MODEL: 'qwen3:8b'
      FACTORY_V2_OLLAMA_URL: 'http://127.0.0.1:11434'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the engineering acceptance harness
        run: python -m py_compile scripts/verify_ebook_v2_local.py
      - name: Install isolated Studio dependencies
        run: python -m pip install -r requirements-ebook-v2.txt
      - name: Install checksum verified official CPU runtime
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tgz -o "$RUNNER_TEMP/ollama.tgz"
          echo "c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6  $RUNNER_TEMP/ollama.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/ollama" --exclude='lib/ollama/cuda*' --exclude='lib/ollama/rocm*' --exclude='lib/ollama/vulkan*'
          rm "$RUNNER_TEMP/ollama.tgz"
      - name: Start local service and install the free model
        shell: bash
        run: |
          nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags > /dev/null
          "$RUNNER_TEMP/ollama/bin/ollama" pull qwen3:8b
      - name: Verify a fresh eight chapter book without operator repairs
        run: python scripts/verify_ebook_v2_local.py --data "${{ runner.temp }}/studio-acceptance" --chapters 8 --min-words 650 --deadline 5400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-local-model-engineering-evidence
          path: |
            ${{ runner.temp }}/studio-acceptance/summary.json
            ${{ runner.temp }}/studio-acceptance/status.json
            ${{ runner.temp }}/studio-acceptance/failure.json
            ${{ runner.temp }}/studio-acceptance/manuscript.md
            ${{ runner.temp }}/studio-acceptance/ebook.pdf
            ${{ runner.temp }}/studio-acceptance/ebook.epub
            ${{ runner.temp }}/studio-acceptance/manuscript.docx
            ${{ runner.temp }}/studio-acceptance/page-*.png
          if-no-files-found: ignore
          retention-days: 7
