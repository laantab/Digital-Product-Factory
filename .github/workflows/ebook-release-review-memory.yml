name: Release review bounded ZIP memory and protected functions

on:
  pull_request:
    paths:
      - 'services/ebook_release_review.py'
      - 'tests/test_ebook_release_review_zip_memory.py'
      - '.github/workflows/ebook-release-review-memory.yml'

permissions:
  contents: read

jobs:
  release-review-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 playwright==1.56.0
      - name: Install Chromium for protected browser acceptance
        run: python -m playwright install --with-deps chromium
      - name: Compile memory fix and tests
        run: python -m py_compile services/ebook_release_review.py tests/test_ebook_release_review_zip_memory.py
      - name: Verify bounded memory and exact photo identity without paid APIs
        run: python -m pytest -q tests/test_ebook_release_review_zip_memory.py
      - name: Verify protected general functions
        run: python scripts/fast_gate.py
      - name: Verify protected ebook and PDF ZIP regressions
        timeout-minutes: 35
        run: |
          python - <<'PY'
          import json, subprocess, sys
          with open('command_center/function_lock_registry.json', encoding='utf-8') as f:
              registry = json.load(f)['functions']
          names = ('ebook', 'pdf_zip_export', 'ebook_one_button_completion')
          files = list(dict.fromkeys(
              path for name in names
              for path in registry[name]['protected_test_files']
          ))
          assert len(files) >= 20, 'Protected regression coverage unexpectedly shrank'
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', *files]))
          PY
