name: One-button ebook memory and protected fast gate

on:
  pull_request:
    paths:
      - 'database.py'
      - 'services/ebook_build_orchestrator.py'
      - 'tests/test_ebook_idempotency_memory.py'
      - 'command_center/function_lock_registry.json'
      - '.github/workflows/ebook-idempotency-memory.yml'

permissions:
  contents: read

jobs:
  one-button-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FACTORY_TEST_MODE: '1'
      FACTORY_DB_BACKEND: sqlite
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      TAVILY_API_KEY: ''
      PEXELS_API_KEY: ''
      UNSPLASH_ACCESS_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Function-lock integrity verifies historical known-good commits.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 playwright==1.56.0
      - name: Install Chromium for protected saved-product browser tests
        run: python -m playwright install --with-deps chromium
      - name: Compile modified Python
        run: python -m py_compile database.py services/ebook_build_orchestrator.py tests/test_ebook_idempotency_memory.py
      - name: Check bounded-memory lookup and owner isolation
        run: python -m pytest -q tests/test_ebook_idempotency_memory.py
      - name: Check offline one-button PDF/ZIP fixture and browser routing
        run: |
          python -m pytest -q \
            tests/test_ebook_creation_modes.py::test_legacy_build_keys_are_preserved_and_new_paths_do_not_collide \
            tests/test_ebook_creation_modes.py::test_design_uses_factory_matching_only_for_the_automatic_path \
            tests/test_ebook_creation_modes.py::test_automatic_visuals_still_refuse_a_failed_quality_gate \
            tests/test_ebook_creation_modes.py::test_automatic_build_reaches_real_pdf_and_zip_without_choice_pauses \
            tests/test_ebook_creation_modes.py::test_recommendation_button_starts_the_complete_build_and_custom_form_offers_six_styles \
            tests/test_ebook_build_browser_routing.py
      - name: Check general protected functions and customer paths
        run: python scripts/fast_gate.py
      - name: Validate every protected one-button ebook regression before relocking
        timeout-minutes: 30
        run: |
          python - <<'PY'
          import json, subprocess, sys
          with open('command_center/function_lock_registry.json', encoding='utf-8') as f:
              entry = json.load(f)['functions']['ebook_one_button_completion']
          assert entry['status'] in ('UNLOCKED', 'LOCKED')
          files = entry['protected_test_files']
          assert len(files) >= 20, 'Protected ebook coverage unexpectedly shrank'
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', *files]))
          PY
