<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-indigo-600">Digital Product Factory</p>
        <h1 class="text-xl font-bold text-slate-900">Crossword Builder</h1>
      </div>
      <a href="/" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">← Back to Dashboard</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-8">
    <p class="text-sm text-slate-600 mb-6">
      Create a printable crossword PDF from a topic or your own answer list. Clues, answers, and answer keys are built for you.
    </p>

    <form id="cwForm" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <fieldset class="space-y-3">
        <legend class="text-sm font-bold text-slate-900">Creation Mode</legend>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="creation_mode" value="topic" checked />
          Create From Topic
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="creation_mode" value="custom_word_list" />
          Use My Own Answer List
        </label>
      </fieldset>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="block sm:col-span-2">
          <span class="text-sm font-medium">Product Title *</span>
          <input name="product_title" type="text" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="My Crossword Puzzle Book" />
        </label>
        <label class="block sm:col-span-2">
          <span class="text-sm font-medium">Subtitle</span>
          <input name="subtitle" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Optional subtitle" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Author</span>
          <input name="author" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Shown on the cover" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Theme / Topic *</span>
          <input name="theme" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Bible Stories, Gold Rush, Brain Fitness..." />
        </label>
        <label class="block sm:col-span-2">
          <span class="text-sm font-medium">Sub-topic</span>
          <input name="sub_topic" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Optional — narrows the clue set" />
        </label>
      </div>

      <div id="customWordsWrap" class="hidden space-y-4">
        <label class="block">
          <span class="text-sm font-medium">Custom Answer List *</span>
          <span class="block text-xs text-slate-500 mb-1">One answer per line. Letters only — no spaces or punctuation.</span>
          <textarea name="custom_words" rows="8" class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-sm" placeholder="NUGGET&#10;RIVER&#10;MINER"></textarea>
        </label>
        <label class="block">
          <span class="text-sm font-medium">Custom Clues</span>
          <span class="block text-xs text-slate-500 mb-1">Optional. One per line as <code>ANSWER: clue text</code>. Any answer you skip gets a generated clue.</span>
          <textarea name="custom_clues" rows="6" class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-sm" placeholder="NUGGET: A lump of gold&#10;RIVER: Where panning happens"></textarea>
        </label>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-medium">Difficulty</span>
          <select name="difficulty" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium">Grid Size</span>
          <select name="grid_size" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="11">11 × 11</option>
            <option value="13">13 × 13</option>
            <option value="15" selected>15 × 15</option>
            <option value="17">17 × 17</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium">Answers Per Puzzle</span>
          <input name="words_per_puzzle" type="number" min="4" max="30" value="10" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
        </label>
      </div>

      <fieldset class="space-y-3">
        <legend class="text-sm font-bold text-slate-900">Output Type</legend>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="output_type" value="single_worksheet" checked />
          Single Worksheet
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="output_type" value="book" />
          Full Book
        </label>
      </fieldset>

      <label id="puzzleCountWrap" class="hidden block">
        <span class="text-sm font-medium">Number of Puzzles</span>
        <input name="number_of_puzzles" type="number" min="1" max="50" value="12" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
      </label>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <fieldset class="space-y-3">
          <legend class="text-sm font-bold text-slate-900">Include Answer Key</legend>
          <label class="flex items-center gap-2 text-sm">
            <input type="radio" name="include_answer_key" value="yes" checked />
            Yes
          </label>
          <label class="flex items-center gap-2 text-sm">
            <input type="radio" name="include_answer_key" value="no" />
            No
          </label>
        </fieldset>

        <fieldset class="space-y-3">
          <legend class="text-sm font-bold text-slate-900">Include Cover Page</legend>
          <label class="flex items-center gap-2 text-sm">
            <input type="radio" name="include_cover" value="yes" checked />
            Yes
          </label>
          <label class="flex items-center gap-2 text-sm">
            <input type="radio" name="include_cover" value="no" />
            No
          </label>
        </fieldset>
      </div>

      <button type="submit" id="generateBtn" class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white hover:bg-indigo-700">
        Generate Crossword PDF
      </button>
    </form>

    <div id="statusBox" class="hidden mt-6 rounded-xl border p-4 text-sm"></div>
    <div id="downloadBox" class="hidden mt-4">
      <a id="downloadLink" href="#" class="inline-flex items-center rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white hover:bg-emerald-700">
        Download PDF
      </a>
    </div>
  </main>

  <script src="/static/js/crossword_builder.js"></script>
</body>
</html>
