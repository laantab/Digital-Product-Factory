<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf }}"><title>Book Studio | Digital Product Factory Pro</title>
<style>
:root{font-family:system-ui,sans-serif;color:#233d33;background:#f4f3ed}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:30px}header{border-bottom:1px solid #bdcabc;margin-bottom:25px}h1{font-family:Georgia,serif;font-size:40px;margin:5px 0}h2{margin-top:0}main{display:grid;grid-template-columns:240px 1fr;gap:24px}section,aside{background:white;border:1px solid #d3dcd1;border-radius:12px;padding:24px}label{display:block;margin-top:14px;font-weight:600}input,textarea,select{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #abbdae;border-radius:6px;font:inherit}textarea{min-height:190px}button,.download{display:inline-block;background:#285b49;color:white;border:0;border-radius:6px;padding:12px 18px;margin:12px 8px 4px 0;cursor:pointer;font:inherit;text-decoration:none}button.secondary{background:#eef2e9;color:#285b49}#saved button{display:block;width:100%;text-align:left}#message{padding:14px 0;white-space:pre-wrap}iframe{width:100%;height:650px;border:1px solid #d3dcd1;margin-top:20px}.muted{color:#60736a;font-size:14px}@media(max-width:700px){main{grid-template-columns:1fr}body{padding:15px}h1{font-size:32px}}
</style></head><body><header><p class="muted">DIGITAL PRODUCT FACTORY PRO</p><h1>Book Studio</h1><p>A clear path from your manuscript to a finished download.</p></header>
<main><aside><h2>Saved books</h2><button id="new" class="secondary">New book</button><div id="saved"></div></aside>
<section><form id="form"><h2>Create your book</h2><p class="muted">Choose your starting point. External fact and plagiarism verification are not included in this reconstruction.</p>
<label>Starting point<select name="source" id="source"><option value="manuscript">Use my manuscript</option><option value="ollama">Write from my topic</option></select></label>
<label id="manualTitle">Book title<input name="title" required maxlength="180"></label><label>Author<input name="author" required maxlength="100"></label>
<label id="manualTheme">Design<select name="theme"><option value="wellness">Warm Wellness</option><option value="editorial">Editorial Blue</option><option value="practical">Practical Guide</option></select></label>
<div id="topicFields" hidden><label>Topic<input name="topic" maxlength="2000" disabled></label><label>Who is this for?<input name="audience" maxlength="500" disabled></label><label>What should readers be able to do?<input name="outcome" maxlength="1000" disabled></label>
<label>Mode<select name="mode" disabled><option value="automatic">Automatic — choose title and cover</option><option value="manual">Manual — approve outline and final pages</option></select></label>
<label>Chapters<input name="chapter_count" type="number" value="8" min="2" max="20" disabled></label><label>Minimum words per chapter<select name="min_words" disabled><option value="650">650</option><option value="450">450</option><option value="1000">1000</option></select></label>
<label><input name="research_acknowledged" type="checkbox" style="display:inline;width:auto" disabled> I understand this reconstruction has not assessed market demand for my topic.</label></div>
<label id="manuscriptField">Chapters<textarea name="manuscript" required placeholder="Start each chapter with ## followed by its title.&#10;&#10;Supply at least two chapters, each with 250 words and three developed paragraphs."></textarea></label>
<button type="submit">Create my book</button></form><div id="message" role="status" aria-live="polite"></div><div id="actions"></div><iframe id="preview" title="Actual book pages" hidden></iframe></section></main>
<script>
const csrf=document.querySelector('meta[name="csrf"]').content, form=document.querySelector('#form'), message=document.querySelector('#message'), actions=document.querySelector('#actions'), preview=document.querySelector('#preview');
let current=null, timer=null, generation=0;
document.querySelector('#source').onchange=()=>{const topic=document.querySelector('#source').value==='ollama';for(const id of ['manualTitle','manualTheme','manuscriptField']){const section=document.querySelector('#'+id);section.hidden=topic;for(const control of section.querySelectorAll('input,select,textarea'))control.disabled=topic;}const fields=document.querySelector('#topicFields');fields.hidden=!topic;for(const control of fields.querySelectorAll('input,select')){control.disabled=!topic;control.required=topic;}};
async function api(path,body){let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||'Book service is unavailable');return d;}
function error(e){message.textContent=e.message;}
async function listing(){const data=await api('/api/books');let saved=document.querySelector('#saved');saved.replaceChildren();for(const book of data.books){const b=document.createElement('button');b.className='secondary';b.textContent=book.title+' · '+book.state.toLowerCase().replaceAll('_',' ');b.onclick=()=>open(book.id);saved.append(b);}}
function render(book){current=book;form.hidden=true;actions.replaceChildren();message.textContent=book.title+'\n'+book.chapters_checked+' of '+book.chapters_total+' chapters checked.\n'+book.review_scope;
if(book.activity)message.textContent+='\n'+book.activity+' · '+book.words_saved+' words saved';
if(book.state==='RUNNING')message.textContent+='\nPreparing your saved book. You can close this page; the separate worker continues.';
if(book.state==='WAITING_SERVICE')message.textContent+='\nWaiting for the Book Studio worker to reconnect. Your saved work is preserved.';
if(book.state==='NEEDS_ATTENTION'){message.textContent+='\nThis step needs attention. Completed chapters are saved.';button('Continue saved work','resume');}
if(book.state==='WAITING_TITLE'){message.textContent+='\nChoose your title.';for(const title of book.titles)choice(title,'title',title);}
if(book.state==='WAITING_OUTLINE'){message.textContent+='\nReview the chapter plan.';const list=document.createElement('ol');for(const chapter of book.outline){const item=document.createElement('li');item.textContent=chapter.title+' — '+chapter.purpose;list.append(item);}actions.append(list);choice('Approve chapter plan','outline',true);}
if(book.state==='WAITING_COVER'){message.textContent+='\nChoose the cover and interior design.';for(const [theme,label] of Object.entries({wellness:'Warm Wellness',editorial:'Editorial Blue',practical:'Practical Guide'}))choice(label,'cover',theme);}
if(book.state==='REVIEW'){message.textContent+='\nReview your pages before approving this edition.';preview.hidden=false;preview.src='/api/books/'+book.id+'/files/ebook.pdf?preview=1';button('Approve this edition','approve');}
if(book.state==='READY'){message.textContent+='\nYour reviewed edition is ready to download.';preview.hidden=false;preview.src='/api/books/'+book.id+'/files/ebook.pdf?preview=1';for(const name of book.files){let a=document.createElement('a');a.className='download';a.textContent={'ebook.pdf':'Download PDF','package.zip':'Download complete ZIP','manuscript.md':'Editable manuscript'}[name]||name;a.href='/api/books/'+book.id+'/files/'+name;actions.append(a);}}
}
function button(label,action){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{render(await api('/api/books/'+current.id+'/'+action,{revision:current.revision}));await listing();schedule();}catch(e){error(e);b.disabled=false;}};actions.append(b);}
function choice(label,action,value){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{render(await api('/api/books/'+current.id+'/decision',{revision:current.revision,action,value}));await listing();schedule();}catch(e){error(e);b.disabled=false;}};actions.append(b);}
function schedule(){clearTimeout(timer);if(current&&['RUNNING','WAITING_SERVICE'].includes(current.state)){const version=generation,id=current.id;timer=setTimeout(async()=>{try{const book=await api('/api/books/'+id);if(version===generation){render(book);schedule();}}catch(e){error(e);if(version===generation)schedule();}},1500);}}
async function open(id){generation++;clearTimeout(timer);preview.hidden=true;try{render(await api('/api/books/'+id));sessionStorage.setItem('studio-book',id);schedule();}catch(e){error(e);}}
document.querySelector('#new').onclick=()=>{generation++;clearTimeout(timer);current=null;form.hidden=false;message.textContent='';actions.replaceChildren();preview.hidden=true;sessionStorage.removeItem('studio-book');};
form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const f=new FormData(form);let spec;if(f.get('source')==='ollama'){spec={source:'ollama',topic:f.get('topic'),audience:f.get('audience'),outcome:f.get('outcome'),author:f.get('author'),mode:f.get('mode'),chapter_count:Number(f.get('chapter_count')),min_words:Number(f.get('min_words')),research_acknowledged:f.get('research_acknowledged')==='on'};}else{const parts=f.get('manuscript').split(/^## (.+)\s*$/m);if(parts.length<5)throw Error('Start at least two chapters with ## and a title');const chapters=[];for(let i=1;i<parts.length-1;i+=2)chapters.push({title:parts[i].trim(),text:parts[i+1].trim()});spec={title:f.get('title'),author:f.get('author'),theme:f.get('theme'),chapters};}const fingerprint=JSON.stringify(spec);let saved=JSON.parse(sessionStorage.getItem('studio-request')||'null');if(!saved||saved.fingerprint!==fingerprint){saved={fingerprint,key:crypto.randomUUID()};sessionStorage.setItem('studio-request',JSON.stringify(saved));}const book=await api('/api/books',{request_key:saved.key,spec});await listing();await open(book.id);}catch(e){error(e);}finally{b.disabled=false;}};
listing().catch(error);const previous=sessionStorage.getItem('studio-book');if(previous)open(previous);
</script></body></html>
